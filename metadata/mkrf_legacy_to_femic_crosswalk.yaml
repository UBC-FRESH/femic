schema_version: 1

legacy_case:
  case_id: mkrf_legacy_2016
  authoritative_root: MKRF_Cosmin_Model/MKRF
  compiled_bundle_root: MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF
  upstream_prep_root: MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData
  operator_context_root: MKRF_Cosmin_Model/MKRF/05_Documents

reference_templates:
  plain_git_snapshot: external/femic-k3z-instance
  datalad_runtime_split: external/femic-tsa29-instance

crosswalk:
  compiled_runtime_package:
    disposition: future_instance_runtime_payload
    legacy_components:
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/baseMKRF.pin
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Tracks/*.csv
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Spatial/fragments.*
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Spatial/topo_frag100.csv
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Targets/*.bsh
    candidate_femic_homes:
      - models/mkrf_patchworks_model/analysis/
      - models/mkrf_patchworks_model/tracks/
      - output/patchworks_mkrf_validated/fragments/
    notes:
      - Treat this as the closest analogue to the checked-in K3Z/TSA29 Patchworks runtime surface.
      - Preserve the compiled-package anatomy before attempting any FEMIC exporter rebuild.

  editable_model_sources:
    disposition: future_rebuild_source_and_recovery_evidence
    legacy_components:
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/baseMKRF.xml
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/Curves.xml
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/002_base.xlsm
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/001_makeCurves_XML.py
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/003_MakeAccounts.py
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/XML/CSV/*
    candidate_femic_homes:
      - output/patchworks_mkrf_validated/forestmodel.xml
      - data/legacy_mkrf/xml_builders/
      - evidence/legacy_mkrf/xml_recovery/
    notes:
      - "Treat 002_base.xlsm plus the XML/CSV lane as the governing editable-source evidence for the core model structure."
      - "Treat baseMKRF.xml as a generated ForestModel artifact emitted by the SPS spreadsheet tool."
      - "Treat Curves.xml as a generated curve fragment emitted by 001_makeCurves_XML.py from XML/CSV/CURVE_TABLE.csv."
      - "Preserve the workbook data surfaces and replace the SPS VBA serializer with FEMIC-native builders."
      - "Break the workbook into FEMIC-facing source families such as Input Variables, Codes, Curve Library, Netdown, Attrib, Treat, Post Renewal Succession, and Lookups."
      - "Tracked workbook review extracts now live under metadata/mkrf_xlsm_review/ as parent-side evidence surfaces."
      - "The first MKRF-first translated Input Variables config now lives under external/femic-mkrf-instance/config/legacy_xml_builder/ and now makes description/year/horizon plus the legacy block/area/age/exclude expressions live in exporter behavior."

  scenario_and_control_scripts:
    disposition: future_runbook_and_analysis_support
    legacy_components:
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/runME.bsh
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/ScenarioSet.bsh
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Scripts/*.bsh
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Targets/000_Targets_Builder.xlsx
    candidate_femic_homes:
      - runbooks/legacy_patchworks_scripts/
      - docs/legacy_mkrf/
      - data/legacy_mkrf/targets/
    notes:
      - These are valuable for reconstructing target logic and scenario choreography even if FEMIC later replaces them with native config.

  upstream_mapping_and_yield_prep:
    disposition: future_raw_input_and_lineage_surface
    legacy_components:
      - MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData/Source.gdb
      - MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData/Resultant.gdb
      - MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData/Resultant_info_v1.xlsx
      - MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData/00_Stats/*.csv
      - MKRF_Cosmin_Model/MKRF/03_MappingAnalysisData/03_Yields/VDYP/*
    candidate_femic_homes:
      - data/legacy_mkrf/source_geodatabases/
      - data/legacy_mkrf/resultant_geodatabases/
      - data/legacy_mkrf/yields/vdyp/
      - docs/legacy_mkrf/
    notes:
      - Treat this lane as upstream lineage and preprocessing evidence, not as a ready-to-run FEMIC contract yet.
      - It likely informs future stage-00 and stage-01 recovery work.

  historical_outputs_and_reports:
    disposition: archival_evidence
    legacy_components:
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Outputs/001_Base/*
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/Outputs/z_Comparisons/*
      - MKRF_Cosmin_Model/MKRF/04_Models/PW_MKRF/patchworksLog.csv
      - MKRF_Cosmin_Model/MKRF/05_Documents/MKRF_Modeling_Notes.pdf
    candidate_femic_homes:
      - evidence/legacy_mkrf/
      - docs/legacy_mkrf/
    notes:
      - Preserve these as benchmark and interpretation artifacts.
      - Do not yet assume they are canonical enough for automated regression baselines.

unresolved_seams:
  - seam_id: roads_runtime_surface
    status: unresolved
    legacy_signal:
      - baseMKRF.pin references ../roads/access.shp and related route files when routes are enabled
    reason:
      - no in-scope roads folder was inventoried in the authoritative first-pass corpus
  - seam_id: governing_editable_source
    status: resolved
    legacy_signal:
      - "baseMKRF.xml identifies the SPS spreadsheet tool and records 002_base.xlsm in the generated header"
      - "baseMKRF.xml includes Curves.xml through the beforeCurves entity"
      - "002_base.xlsm contains the ForestModel.bas VBA builder with DumpXML(...)"
    reason:
      - the governing editable-source seam is the workbook-driven parameter lane, not the checked-in generated XML
  - seam_id: orthos_operational_role
    status: unresolved
    legacy_signal:
      - 03_MappingAnalysisData/Orthos_2016 is present
    reason:
      - not yet clear whether it is contextual QA only or part of a reproducible preprocessing contract

next_bounded_step:
  recommendation: operationalize_additional_stratification_columns
  description:
    Operationalize the remaining staged Input Variables
    additional-stratification column bindings before broadening into Netdown
    or other workbook surfaces.
