workflow:
  id: k3z_model_build
  name: K3Z FEMIC model-build workflow
  description: Plan-only FreshForge graph for the FEMIC K3Z model-build path.
nodes:
  - id: validate_case
    provider: femic.validate_case
    outputs:
      case_validation: case_preflight_ok
    parameters:
      instance_root: external/femic-k3z-instance
      run_config: config/run_profile.k3z.yaml
  - id: geospatial_preflight
    provider: femic.geospatial_preflight
    needs:
      - validate_case
    inputs:
      case_validation: validate_case.case_validation
    outputs:
      geospatial_runtime: geospatial_runtime_ok
    parameters:
      instance_root: external/femic-k3z-instance
  - id: compile_upstream
    provider: femic.compile_upstream
    needs:
      - geospatial_preflight
    inputs:
      geospatial_runtime: geospatial_preflight.geospatial_runtime
    outputs:
      btc_handoff: stage01a_btc_handoff
    parameters:
      instance_root: external/femic-k3z-instance
      run_config: config/run_profile.k3z.yaml
      run_id: k3z_freshforge_plan
    artifacts:
      run_manifest: runtime/logs/run_manifest-k3z_freshforge_plan.json
  - id: btc_post_tipsy
    provider: femic.btc_post_tipsy
    needs:
      - compile_upstream
    inputs:
      btc_handoff: compile_upstream.btc_handoff
    outputs:
      model_input_bundle: model_input_bundle
    parameters:
      instance_root: external/femic-k3z-instance
      run_config: config/run_profile.k3z.yaml
      tsa: k3z
      run_id: k3z_freshforge_plan
    artifacts:
      btc_manifest: runtime/logs/btc_manifest-k3z_freshforge_plan.json
      post_tipsy_manifest: runtime/logs/run_manifest-post_tipsy_k3z_freshforge_plan.json
  - id: export_patchworks
    provider: femic.export_patchworks
    needs:
      - btc_post_tipsy
    inputs:
      model_input_bundle: btc_post_tipsy.model_input_bundle
    outputs:
      patchworks_package: k3z_patchworks_model
    parameters:
      instance_root: external/femic-k3z-instance
      run_config: config/run_profile.k3z.yaml
      tsa: k3z
    artifacts:
      forestmodel_xml: models/k3z_patchworks_model/yield/forestmodel.xml
      fragments: models/k3z_patchworks_model/shapefiles/blocks.shp
  - id: patchworks_preflight
    provider: femic.patchworks_preflight
    needs:
      - export_patchworks
    inputs:
      patchworks_package: export_patchworks.patchworks_package
    outputs:
      patchworks_runtime: patchworks_runtime_ok
    parameters:
      instance_root: external/femic-k3z-instance
      patchworks_config: config/patchworks.runtime.windows.yaml
  - id: matrix_build
    provider: femic.matrix_build
    needs:
      - patchworks_preflight
    inputs:
      patchworks_runtime: patchworks_preflight.patchworks_runtime
    outputs:
      compiled_patchworks_model: compiled_k3z_patchworks_model
    parameters:
      instance_root: external/femic-k3z-instance
      patchworks_config: config/patchworks.runtime.windows.yaml
      run_id: k3z_freshforge_plan
    artifacts:
      matrix_build_manifest: runtime/logs/patchworks_matrixbuilder_manifest-k3z_freshforge_plan.json
