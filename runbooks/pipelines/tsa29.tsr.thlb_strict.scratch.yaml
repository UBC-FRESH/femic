schema_version: 1
runbook_kind: femic_pipeline_runbook
label: TSA29 TSR THLB strict product lane from scratch seam
pipeline_id: tsr.thlb_strict
instance_root: .
run_profile: config/run_profile.tsa29.yaml
overlay_paths:
  - config/tsr/overlay.yaml
restart:
  seam_id: scratch
validation_contract:
  contract_kind: tsa29_locked_chain_strict
  locked_chain_ledger_path: config/tsr/thlb_locked_chain_ledger.json
  comparison_report_path: config/tsr/thlb_reconstruction_comparison.md
  required_recipe_path: workbench/tsr/thlb_netdown.locked.recipe.yaml
  notes:
    - This runbook validates strict step 001 from the raw-source GLB build path.
    - The named pipeline must stop after locked-chain row 1 instead of spilling into step 002.
notes:
  - Repo-tracked strict-lane scratch runbook for bounded row-1 validation under #169.
  - Invoke with an explicit instance root, for example:
  - femic pipelines run --runbook runbooks/pipelines/tsa29.tsr.thlb_strict.scratch.yaml --instance-root external/femic-tsa29-instance
