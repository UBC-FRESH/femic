[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femic"
version = "0.1.1a1"
description = "Forest Estate Modelling Integration Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comtypes; platform_system == 'Windows'",
    "distance",
    "fiona",
    "geocube",
    "geopandas",
    "ipyparallel",
    "mapply",
    "matplotlib",
    "nbformat",
    "numpy",
    "openpyxl",
    "pandas",
    "pympler",
    "pywinauto; platform_system == 'Windows'",
    "rasterio",
    "scipy",
    "seaborn",
    "swifter",
    "typer>=0.9",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "datalad[full]",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "types-PyYAML",
]

[project.scripts]
femic = "femic.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
femic = [
    "resources/builtins/*",
    "resources/instance/.gitignore",
    "resources/instance/*",
    "resources/instance/config/*",
    "resources/instance/config/tipsy/*",
    "resources/patchworks/*",
    "resources/instance/runbooks/*",
    "resources/legacy/*.py",
]

[tool.ruff]
extend-exclude = ["src/femic/resources/legacy/*.py"]

[tool.mypy]
exclude = ["^src/femic/resources/legacy/.*\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
