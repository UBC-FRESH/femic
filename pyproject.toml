[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femic"
version = "0.2.0a1"
description = "Forest Estate Modelling Integration Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comtypes; platform_system == 'Windows'",
    "cryptography>=3.1",
    "distance",
    "fiona",
    "geocube",
    "geopandas",
    "ipyparallel",
    "mapply",
    "matplotlib",
    "nbformat",
    "numpy",
    "openpyxl",
    "pandas",
    "pypdf",
    "pympler",
    "pywinauto; platform_system == 'Windows'",
    "rasterio",
    "scipy",
    "seaborn",
    "swifter",
    "typer>=0.9",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
freshforge = [
    "freshforge @ git+https://github.com/UBC-FRESH/freshforge.git@feature/p6-execution-engine",
]
figures = [
    "figrecover[pdf,cv,vlm] @ git+https://github.com/UBC-FRESH/figrecover.git@v0.1.0a1",
]
dev = [
    "datalad[full]",
    "freshforge @ git+https://github.com/UBC-FRESH/freshforge.git@feature/p6-execution-engine",
    "ipywidgets",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "types-PyYAML",
    "types-shapely",
]

[project.scripts]
femic = "femic.cli.main:app"

[project.entry-points."freshforge.providers"]
femic = "femic.freshforge:provider_factory"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
femic = [
    "resources/builtins/*",
    "resources/instance/.gitignore",
    "resources/instance/*",
    "resources/instance/config/*",
    "resources/instance/config/tipsy/*",
    "resources/patchworks/*",
    "resources/pipelines/*",
    "resources/instance/runbooks/*",
    "resources/legacy/*.py",
]

[tool.ruff]
extend-exclude = ["src/femic/resources/legacy/*.py"]

[tool.mypy]
exclude = ["^src/femic/resources/legacy/.*\\.py$"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
