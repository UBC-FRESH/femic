schema_version: 1
registry_kind: pipeline_registry
pipelines:
  - pipeline_id: tsr.thlb_strict
    label: TSR strict THLB product lane
    kind: tsr
    summary: Resolve and run the strict reconstructed TSR THLB product lane.
    default_instance_runbook: runbooks/pipelines/tsr.thlb_strict.yaml
    seams:
      - seam_id: scratch
        start_mode: scratch
        stage_label: Full strict TSR THLB run
      - seam_id: glb
        checkpoint_path: data/tsr/glb_checkpoint.feather
        checkpoint_kind: glb_checkpoint
        baseline_signal: glb_checkpoint_restart
      - seam_id: aflb
        checkpoint_path: data/tsr/aflb_checkpoint.feather
        checkpoint_kind: aflb_checkpoint
        baseline_signal: aflb_checkpoint_restart
        notes:
          - AFLB resultant fragments are the yield-ready forested model universe for downstream bundle generation.
          - Final THLB is a managed-share state assigned to those fragments; NTHLB equals AFLB minus THLB and remains unmanaged/full-retention forest with growth curves.
      - seam_id: aflb_yield_ready
        checkpoint_path: data/tsr/aflb_yield_ready_checkpoint.feather
        checkpoint_kind: aflb_yield_ready_checkpoint
        baseline_signal: aflb_yield_ready_checkpoint_restart
        notes:
          - Use this seam when AU assignment and yield-curve coverage are ready for the full AFLB resultant-fragment universe, including NTHLB retained forest.
      - seam_id: lhlb_curve_ready
        checkpoint_path: data/tsr/lhlb_curve_ready_checkpoint.feather
        checkpoint_kind: lhlb_curve_ready_checkpoint
        baseline_signal: lhlb_curve_ready_checkpoint_restart
    recipes:
      - recipe_id: tsr.thlb_netdown
        recipe_kind: tsr_thlb_netdown
        default_recipe_path: config/tsr/thlb_netdown.recipe.yaml
  - pipeline_id: tsr.thlb_reviewed
    label: TSR reviewed THLB legacy scaffold lane
    kind: tsr
    summary: Resolve and run the reviewed TSR THLB scaffold lane from a runbook.
    default_instance_runbook: runbooks/pipelines/tsr.thlb_reviewed.yaml
    seams:
      - seam_id: scratch
        start_mode: scratch
        stage_label: Full reviewed TSR THLB run
      - seam_id: aflb
        checkpoint_path: data/tsr/aflb_checkpoint.feather
        checkpoint_kind: aflb_checkpoint
        baseline_signal: aflb_checkpoint_restart
        notes:
          - AFLB resultant fragments are the yield-ready forested model universe for downstream bundle generation.
          - Final THLB is a managed-share state assigned to those fragments; NTHLB equals AFLB minus THLB and remains unmanaged/full-retention forest with growth curves.
      - seam_id: aflb_yield_ready
        checkpoint_path: data/tsr/aflb_yield_ready_checkpoint.feather
        checkpoint_kind: aflb_yield_ready_checkpoint
        baseline_signal: aflb_yield_ready_checkpoint_restart
        notes:
          - Use this seam when AU assignment and yield-curve coverage are ready for the full AFLB resultant-fragment universe, including NTHLB retained forest.
      - seam_id: lhlb_curve_ready
        checkpoint_path: data/tsr/lhlb_curve_ready_checkpoint.feather
        checkpoint_kind: lhlb_curve_ready_checkpoint
        baseline_signal: lhlb_curve_ready_checkpoint_restart
    recipes:
      - recipe_id: tsr.thlb_netdown
        recipe_kind: tsr_thlb_netdown
        default_recipe_path: config/tsr/thlb_netdown.recipe.yaml
