name: ground-classifier-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ground-classifier-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run public ground-control guard
        run: python -m pytest tests/test_lidar_ground_control_fixture.py -q
