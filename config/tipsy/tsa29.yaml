      stratum_code_in: ["SBPS_PLI"]
      si_level_in: ["L", "M"]
    assign:
      e:
        Proportion: 0.70
        Regen_Method: "N"
        Regen_Delay: 4
        Density: 1001
        SPP_1: "PL"
        PCT_1: 87
        SPP_2: "AT"
        PCT_2: 10
        SPP_3: "FD"
        PCT_3: 1
        SPP_4: "SX"
        PCT_4: 1
        Util_DBH_cm: 12.5
      f:
        SI_c1: 1.18
        SI_c2: 0.0
        Proportion: 0.30
        Regen_Method: "P"
        Regen_Delay: 4
        Density: 1001
        SPP_1: "PL"
        PCT_1: 87
        SPP_2: "AT"
        PCT_2: 10
        SPP_3: "FD"
        PCT_3: 1
        SPP_4: "SX"
        PCT_4: 1
        GW_1: 3.0
        GW_age_1: 12
        Util_DBH_cm: 12.5

